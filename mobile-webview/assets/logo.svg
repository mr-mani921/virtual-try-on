<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#gradient)"/>
  
  <!-- Watch Circle -->
  <circle cx="256" cy="256" r="140" fill="#0f172a" stroke="#3b82f6" stroke-width="8"/>
  
  <!-- Clock Hands -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="320" y2="256" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Hour Markers -->
  <circle cx="256" cy="136" r="6" fill="#3b82f6"/>
  <circle cx="256" cy="376" r="6" fill="#3b82f6"/>
  <circle cx="376" cy="256" r="6" fill="#3b82f6"/>
  <circle cx="136" cy="256" r="6" fill="#3b82f6"/>
  
  <!-- Watch Bands -->
  <rect x="226" y="60" width="60" height="80" rx="8" fill="#1e293b"/>
  <rect x="226" y="372" width="60" height="80" rx="8" fill="#1e293b"/>
  
  <!-- Center Dot -->
  <circle cx="256" cy="256" r="10" fill="#06b6d4"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
</svg>
